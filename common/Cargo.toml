[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
phf = { version = "0.14.0", features = ["macros", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
slug = "0.1.6"
strum = { version = "0.28", features = ["derive"] }
sqlx = { version = "0.9.0", optional = true }
similar = { version = "3.2.1", features = ["serde"], optional = true }
itertools = { version = "0.15.0", optional = true }

[lints.clippy]
print_stdout = "deny"

[features]
default = []
sqlx = ["dep:sqlx"]
diff = ["dep:similar", "dep:itertools"]
